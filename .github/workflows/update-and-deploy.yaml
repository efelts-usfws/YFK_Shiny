name: Update Data and Deploy

on:
  schedule:
    - cron: '0 15 * * *'   # 8am Spokane time (UTC-7)
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab
  
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gdal-bin \
            libabsl-dev \
            libcurl4-openssl-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libx11-dev \
            pandoc

      - uses: r-lib/actions/setup-renv@v2
      
      - name: Run data update script
        run: Rscript data/update_data.R


      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update data $(date -u '+%Y-%m-%d')"
          git push

  deploy:
    runs-on: ubuntu-latest
    needs: update-data

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake gdal-bin libabsl-dev libcurl4-openssl-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libx11-dev pandoc

      - uses: r-lib/actions/setup-renv@v2

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "
            rsconnect::setAccountInfo(
              name   = Sys.getenv('SHINYAPPS_ACCOUNT'),
              token  = Sys.getenv('SHINYAPPS_TOKEN'),
              secret = Sys.getenv('SHINYAPPS_SECRET')
            )
            rsconnect::deployApp(
              appName = 'YanKeeFork_Shiny',
              appPrimaryDoc =  'app.R',
              forceUpdate = TRUE
            )
          "